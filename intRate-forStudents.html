<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Interest Rate Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .calc-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }
        h2 {
            color: #0f172a;
            font-size: 1.5rem;
            margin-bottom: 6px;
            font-weight: 700;
        }
        p.sub {
            color: #64748b;
            font-size: 0.875rem;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.95rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #cc0033;
        }
        button {
            width: 100%;
            background-color: #cc0033;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #a30029;
        }
        .result-box {
            margin-top: 24px;
            padding: 16px;
            background-color: #f1f5f9;
            border-radius: 8px;
            text-align: center;
        }
        .result-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            font-weight: 600;
        }
        .result-value {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0f172a;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="calc-card">
        <h2>Compound Interest Calculator</h2>
        <p class="sub">Calculate future investment growth over time.</p>

        <div class="form-group">
            <label for="origAmount">Original Principal ($)</label>
            <input type="number" id="origAmount" value="1000">
        </div>

        <div class="form-group">
            <label for="numYears">Duration (Years)</label>
            <input type="number" id="numYears" value="5">
        </div>

        <div class="form-group">
            <label for="intRate">Annual Interest Rate (e.g. 0.05 for 5%)</label>
            <input type="number" step="0.01" id="intRate" value="0.05">
        </div>

        <div class="form-group">
            <label for="numPayYear">Compounding Frequency (Per Year)</label>
            <input type="number" id="numPayYear" value="12">
        </div>

        <button onclick="calculateInterest()">Calculate Returns</button>

        <div class="result-box">
            <div class="result-title">Estimated Total</div>
            <div class="result-value" id="result">$1,283</div>
        </div>
    </div>

    <script>
        function inRate(c, t, r, n) {
            return Math.round(c * Math.pow((1 + (r / n)), n * t));
        }

        function calculateInterest() {
            var c = parseFloat(document.getElementById("origAmount").value);
            var t = parseFloat(document.getElementById("numYears").value);
            var r = parseFloat(document.getElementById("intRate").value);
            var n = parseFloat(document.getElementById("numPayYear").value);

            if (isNaN(c) || isNaN(t) || isNaN(r) || isNaN(n)) {
                document.getElementById("result").innerText = "Please fill all fields";
                return;
            }

            var total = inRate(c, t, r, n);
            document.getElementById("result").innerText = "$" + total.toLocaleString();
        }
    </script>

</body>
</html>
