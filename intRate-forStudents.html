<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Interest Rate Calculator</title>
    <style>
        body {
            background-color: bisque;
            font-family: Optima, sans-serif;
            color: brown;
            text-align: center;
            padding: 40px 20px;
        }
        .calc-box {
            background: white;
            max-width: 400px;
            margin: 0 auto;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        input {
            font-size: 16px;
            padding: 8px;
            margin: 6px 0 16px 0;
            width: 80%;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            font-size: 18px;
            background-color: coral;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #e05538;
        }
        #result {
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="calc-box">
        <h2>Compound Interest Calculator</h2>
        
        <label>Original Amount ($):</label><br>
        <input type="number" id="origAmount" value="1000"><br>

        <label>Number of Years:</label><br>
        <input type="number" id="numYears" value="5"><br>

        <label>Interest Rate (e.g. 0.05 for 5%):</label><br>
        <input type="number" step="0.01" id="intRate" value="0.05"><br>

        <label>Payments Per Year:</label><br>
        <input type="number" id="numPayYear" value="12"><br>

        <button onclick="calculateInterest()">Calculate Total</button>

        <div id="result"></div>
    </div>

    <script>
        function inRate(c, t, r, n) {
            return Math.round(c * Math.pow((1 + (r / n)), n * t));
        }

        function calculateInterest() {
            var c = parseFloat(document.getElementById("origAmount").value);
            var t = parseFloat(document.getElementById("numYears").value);
            var r = parseFloat(document.getElementById("intRate").value);
            var n = parseFloat(document.getElementById("numPayYear").value);

            var total = inRate(c, t, r, n);
            document.getElementById("result").innerText = "Total Amount Calculated: $" + total.toLocaleString();
        }
    </script>

</body>
</html>
